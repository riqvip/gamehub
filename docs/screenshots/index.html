<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub screenshots</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#edf1f7)}p{color:var(--muted-foreground,#7b8494);margin:0 0 12px}.viewer{background:var(--card,#161e2a);border:1px solid var(--border,#283343);border-radius:var(--radius,12px);padding:16px;margin-bottom:16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.heading strong{font-size:15px}.heading button,.heading a{background:var(--secondary,#233043);color:var(--secondary-foreground,#edf1f7);border:1px solid var(--border,#364357);border-radius:6px;padding:6px 10px;font:inherit;text-decoration:none;cursor:pointer}.stage{max-height:850px;overflow:auto;display:flex;justify-content:center}.stage img{display:block;width:100%;height:auto;max-height:740px;object-fit:contain}.stage.zoom img{max-height:none;align-self:start}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.thumb{border:1px solid var(--border,#283343);border-radius:8px;padding:6px;background:var(--card,#161e2a);color:var(--foreground,#edf1f7);text-align:left;cursor:pointer;min-width:0}.thumb[aria-pressed=true]{outline:2px solid var(--primary,#a9ecc6);outline-offset:1px}.thumb img{display:block;width:100%;height:90px;object-fit:contain;background:var(--code-background,#0c1017);border-radius:4px}.thumb span{display:block;padding:6px 2px 0;font-size:11px}button:focus-visible,a:focus-visible{outline:3px solid var(--ring,#85b9ff);outline-offset:3px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb img{height:95px}.stage img{max-height:650px}}
</style></head><body><p>16 screenshots from the running local application. Select any thumbnail. Sample mods are labelled demo fixtures.</p><section class="viewer"><div class="heading"><strong id="caption">Mod library • demo packages</strong><span><button id="zoom" type="button">Zoom / fit</button> <a id="download" download href="08-mod-library.png">PNG ↓</a></span></div><div class="stage" id="stage"><img id="large" src="08-mod-library.png" alt="Mod library • demo packages"></div></section><div class="grid"><button class="thumb" type="button" data-label="Sign in" aria-pressed="false"><img src="01-login.png" alt="Sign in" loading="eager"><span>Sign in</span></button><button class="thumb" type="button" data-label="Workspace overview" aria-pressed="false"><img src="02-overview.png" alt="Workspace overview" loading="eager"><span>Workspace overview</span></button><button class="thumb" type="button" data-label="Create a server" aria-pressed="false"><img src="03-create-server.png" alt="Create a server" loading="eager"><span>Create a server</span></button><button class="thumb" type="button" data-label="Server health" aria-pressed="false"><img src="04-server-health.png" alt="Server health" loading="eager"><span>Server health</span></button><button class="thumb" type="button" data-label="Live console &amp; RCON" aria-pressed="false"><img src="05-console.png" alt="Live console &amp; RCON" loading="eager"><span>Live console &amp; RCON</span></button><button class="thumb" type="button" data-label="Connected players" aria-pressed="false"><img src="06-players.png" alt="Connected players" loading="eager"><span>Connected players</span></button><button class="thumb" type="button" data-label="Server settings" aria-pressed="false"><img src="07-settings.png" alt="Server settings" loading="eager"><span>Server settings</span></button><button class="thumb" type="button" data-label="Mod library • demo packages" aria-pressed="false"><img src="08-mod-library.png" alt="Mod library • demo packages" loading="eager"><span>Mod library • demo packages</span></button><button class="thumb" type="button" data-label="Upload, URL &amp; Nexus installation" aria-pressed="false"><img src="09-install-mod.png" alt="Upload, URL &amp; Nexus installation" loading="eager"><span>Upload, URL &amp; Nexus installation</span></button><button class="thumb" type="button" data-label="Trusted URL download form" aria-pressed="false"><img src="09b-install-url.png" alt="Trusted URL download form" loading="eager"><span>Trusted URL download form</span></button><button class="thumb" type="button" data-label="Verified backups &amp; scheduling" aria-pressed="false"><img src="10-backups.png" alt="Verified backups &amp; scheduling" loading="eager"><span>Verified backups &amp; scheduling</span></button><button class="thumb" type="button" data-label="Restore preview &amp; confirmation" aria-pressed="false"><img src="11-restore-preview.png" alt="Restore preview &amp; confirmation" loading="eager"><span>Restore preview &amp; confirmation</span></button><button class="thumb" type="button" data-label="Administrative activity" aria-pressed="false"><img src="12-activity.png" alt="Administrative activity" loading="eager"><span>Administrative activity</span></button><button class="thumb" type="button" data-label="Mobile • server overview" aria-pressed="false"><img src="13-mobile-overview.png" alt="Mobile • server overview" loading="eager"><span>Mobile • server overview</span></button><button class="thumb" type="button" data-label="Mobile • mod library" aria-pressed="false"><img src="14-mobile-mods.png" alt="Mobile • mod library" loading="eager"><span>Mobile • mod library</span></button><button class="thumb" type="button" data-label="Mobile • mod installation" aria-pressed="false"><img src="15-mobile-install.png" alt="Mobile • mod installation" loading="eager"><span>Mobile • mod installation</span></button></div><script>
const large=document.getElementById('large'),caption=document.getElementById('caption'),download=document.getElementById('download');download.href=large.src;for(const button of document.querySelectorAll('.thumb')){button.addEventListener('click',()=>{for(const b of document.querySelectorAll('.thumb'))b.setAttribute('aria-pressed',String(b===button));large.src=button.querySelector('img').src;large.alt=button.dataset.label;caption.textContent=button.dataset.label;download.href=large.src;document.getElementById('stage').scrollTop=0;});if(button.dataset.label===caption.textContent)button.setAttribute('aria-pressed','true');}document.getElementById('zoom').onclick=()=>document.getElementById('stage').classList.toggle('zoom');
</script></body></html>
